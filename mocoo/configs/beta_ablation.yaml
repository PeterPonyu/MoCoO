# =============================================================================
# MoCoO Beta Ablation Configuration
# =============================================================================
#
# Proper experimental settings for the beta ablation study (Paper Tables I-V).
# Runs ALL 6 model configurations across beta={0.01, 0.1, 1.0} with
# sufficient training for complex models (Full MoCoO) to converge.
#
# Key differences from the deprecated beta_sweep.yaml:
#   - 200 epochs (was 50) with patience 40 (was 15)
#   - All 6 configurations (was only VAE + Full)
#   - 3000 cells (matches full-scale protocol)
#
# This replaces beta_sweep.yaml for production experiments.
# =============================================================================


# -----------------------------------------------------------------------------
# Shared model hyperparameters (same as default.yaml, beta excluded)
# -----------------------------------------------------------------------------
shared: &shared
  latent_dim: 32
  hidden_dim: 128
  i_dim: 4
  lr: 1.0e-4
  batch_size: 128
  recon: 1.0
  loss_mode: "nb"
  random_seed: 42
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  # NOTE: beta is NOT set here -- it is swept via the sweep section below.


# -----------------------------------------------------------------------------
# Training schedule (sufficient for Full model convergence)
# -----------------------------------------------------------------------------
training:
  epochs: 200
  patience: 40
  val_every: 5


# -----------------------------------------------------------------------------
# Beta values to sweep
# -----------------------------------------------------------------------------
# beta controls the weight of the KL divergence term in the ELBO:
#   L = recon_loss + beta * KL(q(z|x) || p(z))
#
# Low beta (0.01):  Nearly unconstrained latent space; good reconstruction
#                   but potentially entangled / poorly structured latent codes.
# Medium beta (0.1): Moderate posterior regularization; a common "beta-VAE"
#                    setting that often balances reconstruction vs structure.
# High beta (1.0):  Standard VAE objective (beta=1 recovers the true ELBO);
#                   strongest regularization toward the prior.
# -----------------------------------------------------------------------------
sweep:
  parameter: "beta"
  values: [0.01, 0.1, 1.0]


# -----------------------------------------------------------------------------
# Loss weights
# -----------------------------------------------------------------------------
loss_weights:
  vae_reg: 0.6
  ode_reg: 0.4
  moco_weight_with_ode: 0.3
  moco_weight_without_ode: 0.5
  proto_weight: 0.1


# -----------------------------------------------------------------------------
# All 6 ablation configurations
# -----------------------------------------------------------------------------
# Unlike beta_sweep.yaml which only ran VAE + Full, this config runs
# all 6 configurations to enable full component-effect and synergy analysis.
# -----------------------------------------------------------------------------

_ode_params: &ode_params
  use_ode: true
  vae_reg: 0.6
  ode_reg: 0.4

_moco_params_no_ode: &moco_params_no_ode
  use_moco: true
  moco_weight: 0.5
  moco_T: 0.2
  moco_K: 4096

_moco_params_with_ode: &moco_params_with_ode
  use_moco: true
  moco_weight: 0.3
  moco_T: 0.2
  moco_K: 4096

_proto_params: &proto_params
  use_prototype: true
  n_prototypes: 12
  proto_weight: 0.1


configs:
  VAE:
    use_ode: false
    use_moco: false
    use_prototype: false

  VAE+ODE:
    <<: *ode_params
    use_moco: false
    use_prototype: false

  VAE+MoCo:
    <<: *moco_params_no_ode
    use_ode: false
    use_prototype: false

  VAE+MoCo+Proto:
    <<: [*moco_params_no_ode, *proto_params]
    use_ode: false

  VAE+ODE+MoCo:
    <<: [*ode_params, *moco_params_with_ode]
    use_prototype: false

  Full:
    <<: [*ode_params, *moco_params_with_ode, *proto_params]
